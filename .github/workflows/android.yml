# NOTE (2026-11-14): this workflow showed state "deleted" on GitHub with
# 0 runs ever, although the file was never deleted from main (round 1
# baseline). Touching this file re-registers it; if CI stops triggering
# again, check the workflow state at
# https://github.com/ciweihaha/OrionTV-android/actions before anything else.
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger (round 2: the push that re-registered this workflow did
  # not itself start a run, so a manual trigger is kept as a fallback).
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: do NOT use android-actions/setup-android here — v3 runs
      # `sdkmanager tools`, and the obsolete `tools` package no longer
      # exists in the SDK repository, so that step exits 1. The runner
      # already ships an Android SDK with cmdline-tools; use it directly.
      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OrionTV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
